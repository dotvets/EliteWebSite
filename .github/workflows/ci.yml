name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 1) Install via the repository lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 2) Format check (Prettier — repo baseline applied in this PR).
      - name: Format check
        run: npm run format:check

      # 3) Lint (ESLint flat config — defect rules; formatting owned by Prettier).
      - name: Lint
        run: npm run lint

      # 4) TypeScript typecheck (zero-error baseline as of this PR).
      - name: Typecheck
        run: npx tsc --noEmit

      # 5) Application build (client + server bundle).
      - name: Build
        run: npm run build

      # 6) Automated test suites (scripts/run-tests.mts discovers *.test.*).
      - name: Test suites
        run: npm test

      # 7) Integrations Manager verification suite (38 checks).
      - name: im-verify
        run: npm run im-verify

      # 8) Secret scan (committed-secret patterns; fixtures marked explicitly).
      - name: Secret scan
        run: npm run secret-scan

      # 9) Migration/schema validation on real Postgres WASM (pglite), offline.
      - name: Migration validation
        run: npm run migration-verify
